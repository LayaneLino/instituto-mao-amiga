spring.application.name=instituto-mao-amiga-api
server.port=8080

# Banco H2 em memória: os dados voltam ao estado da carga inicial a cada reinício.
spring.datasource.url=jdbc:h2:mem:maoamiga
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.open-in-view=false

# Console Web do H2 Database
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console
spring.h2.console.settings.web-allow-others=true

# Paginação: 20 por página (padrão) e no máximo 50 (size maior que isso é reduzido para 50).
spring.data.web.pageable.default-page-size=20
spring.data.web.pageable.max-page-size=50
